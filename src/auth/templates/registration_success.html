<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1"
        />
        <title>Registration Successful — ITS Test API</title>
        <style>
            :root {
                --bg: #f6f7fb;
                --card: #ffffff;
                --text: #111827;
                --muted: #6b7280;
                --brand: #142a22;
                --accent: #c9a85c;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                margin: 0;
                padding: 24px;
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Arial, "Helvetica Neue", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: grid;
                place-items: center;
            }

            .card {
                width: 100%;
                max-width: 560px;
                background: var(--card);
                border: 1px solid #e5e7eb;
                border-radius: 14px;
                box-shadow: 0 6px 20px rgba(17, 24, 39, 0.08);
                overflow: hidden;
            }

            .header {
                background: var(--brand);
                color: #fcf9f3;
                padding: 18px 22px;
                text-align: center;
                font-weight: 700;
                letter-spacing: 0.2px;
            }

            .content {
                padding: 28px 24px 24px;
                text-align: center;
            }

            .icon {
                display: inline-flex;
                width: 64px;
                height: 64px;
                align-items: center;
                justify-content: center;
                margin: 0 auto 14px;
                border-radius: 50%;
                background: rgba(201, 168, 92, 0.15);
                color: var(--accent);
                font-size: 32px;
            }

            h1 {
                margin: 10px 0 8px;
                font-size: 22px;
                line-height: 1.25;
            }

            p {
                margin: 0 auto 18px;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.6;
                max-width: 460px;
            }

            .actions {
                margin-top: 4px;
            }

            .btn {
                display: inline-block;
                padding: 12px 18px;
                border-radius: 10px;
                border: none;
                background: var(--accent);
                color: var(--brand);
                font-weight: 700;
                text-decoration: none;
                transition:
                    transform 0.12s ease,
                    filter 0.12s ease;
            }

            .btn:hover {
                filter: brightness(0.98);
                transform: translateY(-1px);
            }

            .footer {
                padding: 16px 22px 22px;
                text-align: center;
                font-size: 12px;
                color: #9ca3af;
            }

            @media (max-width: 420px) {
                body {
                    padding: 16px;
                }
                .content {
                    padding: 22px 18px 18px;
                }
            }
        </style>
    </head>
    <body>
        <main class="card" role="main">
            <div class="header">ITS Test API</div>
            <div class="content">
                <div class="icon" aria-hidden="true">✓</div>
                <h1>Registration successful</h1>
                <p>
                    Your account has been created and you are now signed in.
                    You can proceed to the API documentation.
                </p>
                <div class="actions">
                    <a class="btn" href="/docs">Open API docs</a>
                </div>
            </div>
            <div class="footer">You can close this window at any time.</div>
        </main>
    </body>
</html>
